[project]
authors = [
    {name = "Ilya Segal"},
    {name = "Mikhail Mikhasenko"},
    {name = "Remco de Boer"},
]
dependencies = [
    "ampform-dpd~=0.2.1",
    "jupyter-cache",
    "matplotlib",
    "pandas",
    "quarto-cli",
]
description = "Prototype for the amplitude model serialization format"
license = {file = "LICENSE"}
name = "amplitude-serialization"
requires-python = "~=3.13.0"
version = "0.1.0"

[project.urls]
changelog = "https://github.com/RUB-EP1/amplitude-serialization/releases"
documentation = "https://rub-ep1.github.io/amplitude-serialization"
homepage = "https://rub-ep1.github.io/amplitude-serialization"
issues = "https://github.com/RUB-EP1/amplitude-serialization/issues"
source = "https://github.com/RUB-EP1/amplitude-serialization"

[tool.pixi.activation.env]
PYTHONHASHSEED = "0"

[tool.pixi.dependencies]
juliaup = "*"

[tool.pixi.tasks.doc]
cmd = "quarto render"
cwd = "docs"
depends-on = ["install-julia"]

[tool.pixi.tasks.doclive]
cmd = "quarto preview"
cwd = "docs"
depends-on = ["install-julia"]

[tool.pixi.tasks.install-julia]
cmd = """
juliaup add 1.12.3 && \
juliaup default 1.12.3 && \
julia --project -e '
    using Pkg
    Pkg.add("IJulia")
    import IJulia
    IJulia.installkernel("julia-amplitude-serialization")
'
"""

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.tomlsort]
all = false
ignore_case = true
in_place = true
sort_first = [
    "build-system",
    "project",
    "tool.setuptools",
    "tool.setuptools_scm",
]
sort_table_keys = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
